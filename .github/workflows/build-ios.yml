name: Compilar iOS e IPA en la nube

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Instalar carga de trabajo MAUI iOS
      run: |
        dotnet workload install maui-ios

    - name: Restaurar dependencias
      run: dotnet restore DebtMessageManager.csproj

    - name: Publicar aplicación para iOS
      run: |
        dotnet publish DebtMessageManager.csproj -f net10.0-ios -c Release -p:ArchiveOnBuild=true

    - name: Empaquetar archivo .ipa para Sideloadly / AltStore
      run: |
        mkdir -p Payload
        APP_PATH=$(find bin/Release/net10.0-ios -name "*.app" -type d | head -n 1)
        echo "Directorio de la app encontrado: $APP_PATH"
        cp -r "$APP_PATH" Payload/
        zip -r DebtMessageManager.ipa Payload
        mkdir -p output
        mv DebtMessageManager.ipa output/

    - name: Subir instalador IPA
      uses: actions/upload-artifact@v4
      with:
        name: DebtMessageManager-iOS-IPA
        path: output/DebtMessageManager.ipa


